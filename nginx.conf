# CRM DASHBOARD — servidor estático de la SPA
# =============================================================================
# Este nginx NO habla con la API. Sirve archivos y nada más: quien decide que
# `/api` va al contenedor de la API y `/` a este es Traefik, afuera. Un solo
# lugar que rutea es más fácil de razonar que dos encadenados, y además deja la
# cadena de X-Forwarded-For en UN salto, que es lo que espera `TRUST_PROXY=1`.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Comprimir lo que se manda. El bundle de un CRM con MUI no es chico.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Que no anuncie la versión de nginx.
  server_tokens off;

  # LOS ASSETS CON HASH SE CACHEAN PARA SIEMPRE.
  # Vite les pone el hash del contenido en el nombre (`index-a1b2c3.js`), así que
  # un archivo con ese nombre nunca cambia: si cambia el contenido, cambia el
  # nombre. Cachearlos un año es gratis y saca casi todos los pedidos de cada
  # recarga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # EL FALLBACK DE LA SPA — la línea por la que existe este archivo.
  #
  # Las rutas del CRM (`/gastos`, `/ventas/caja`) las resuelve React Router en el
  # navegador: en el disco NO existe ninguna carpeta con esos nombres. Sin este
  # `try_files`, entrar por un link directo o apretar F5 parado en una pantalla
  # devuelve 404 — el error clásico de publicar una SPA como si fuera un sitio
  # de archivos. Con él, cualquier ruta desconocida entrega el index y el router
  # decide qué mostrar.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Y el index NUNCA se cachea. Es el archivo que nombra a los assets con hash;
  # si el navegador se queda con uno viejo, sigue pidiendo el bundle anterior y
  # el deploy no llega nunca al que ya lo tenía abierto.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }
}
